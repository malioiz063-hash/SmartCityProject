<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Submit Complaint</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
min-height:100vh;
padding:40px 20px;
}

.container{
max-width:950px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.1);
}

.header{
background:linear-gradient(135deg,#2563eb,#7c3aed);
padding:35px;
text-align:center;
color:white;
}

.header h2{
font-size:36px;
margin-bottom:10px;
}

.header p{
font-size:15px;
opacity:.9;
}

.form-area{
padding:40px;
}

.back{
display:inline-block;
margin-bottom:25px;
text-decoration:none;
font-weight:600;
color:#2563eb;
font-size:15px;
}

.back:hover{
color:#1d4ed8;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:600;
color:#374151;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:15px;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#2563eb;
box-shadow:0 0 0 4px rgba(37,99,235,.1);
}

textarea{
resize:vertical;
}

#map{
height:350px;
width:100%;
margin-top:12px;
border-radius:15px;
overflow:hidden;
border:2px solid #e5e7eb;
}

.file-upload{
padding:12px;
background:#f9fafb;
border:2px dashed #cbd5e1;
border-radius:12px;
cursor:pointer;
}

.btn{
width:100%;
padding:16px;
margin-top:30px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:600;
cursor:pointer;
color:white;
background:linear-gradient(
135deg,
#2563eb,
#7c3aed
);
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(37,99,235,.25);
}

.section-title{
margin-bottom:20px;
font-size:20px;
font-weight:600;
color:#111827;
}

@media(max-width:768px){

.form-area{
padding:25px;
}

.header h2{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h2>Submit Complaint</h2>
<p>Report civic issues and help improve Smart City services</p>
</div>

<div class="form-area">

<a href="CitizenDashboardServlet" class="back">
← Back To Dashboard
</a>

<div class="section-title">
Complaint Information
</div>

<form action="ComplaintServlet"
      method="post"
      enctype="multipart/form-data">

<label>Complaint Title</label>

<input
type="text"
name="title"
placeholder="Enter complaint title"
required>

<label>Department</label>

<select name="category" required>

<option value="Health Department">Health Department</option>
<option value="Education Department">Education Department</option>
<option value="Transport Department">Transport Department</option>
<option value="Water Authority">Water Authority</option>
<option value="Electricity Authority">Electricity Authority</option>
<option value="Municipal Services">Municipal Services</option>
<option value="Emergency Services">Emergency Services</option>

</select>

<label>Location</label>

<input
type="text"
id="location"
name="location"
placeholder="Select from map or enter manually"
required>

<div id="map"></div>

<label>Description</label>

<textarea
name="description"
rows="6"
placeholder="Enter complete complaint details"
required></textarea>

<label>Upload Image (Optional)</label>

<input
class="file-upload"
type="file"
name="image"
accept="image/*">

<button class="btn" type="submit">
Submit Complaint
</button>

</form>

</div>

</div>

<script>

let map;
let marker;

function initMap() {

    const defaultLocation = {
        lat: 33.6844,
        lng: 73.0479
    };

    map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 12,
            center: defaultLocation
        }
    );

    marker = new google.maps.Marker({
        position: defaultLocation,
        map: map,
        draggable: true
    });

    const geocoder = new google.maps.Geocoder();

    map.addListener("click", function(event){

        marker.setPosition(event.latLng);

        geocoder.geocode(
            {
                location: event.latLng
            },
            function(results, status){

                if(status === "OK" && results[0]){

                    document.getElementById("location").value =
                            results[0].formatted_address;

                }else{

                    document.getElementById("location").value =
                            event.latLng.lat() +
                            ", " +
                            event.latLng.lng();
                }
            }
        );
    });

    marker.addListener("dragend", function(event){

        geocoder.geocode(
            {
                location: event.latLng
            },
            function(results, status){

                if(status === "OK" && results[0]){

                    document.getElementById("location").value =
                            results[0].formatted_address;

                }else{

                    document.getElementById("location").value =
                            event.latLng.lat() +
                            ", " +
                            event.latLng.lng();
                }
            }
        );
    });
}

</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQSRFDk4L0fPIFvNfbFuyLN1-2-GQrTZc&callback=initMap">
</script>

</body>
</html>
