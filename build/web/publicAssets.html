<!DOCTYPE html>
<html>
<head>
    <title>Public Asset Management</title>

    <style>
        body{
            font-family: Arial;
            margin:40px;
        }

        form{
            width:400px;
            padding:20px;
            border:1px solid #ccc;
            border-radius:10px;
        }

        input,select{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 20px;
            cursor:pointer;
        }

        .view-btn{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:green;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<h1>Public Asset Management</h1>

<form action="PublicAssetServlet" method="post">

    <label>Asset Name</label>
    <input type="text"
           name="asset_name"
           required>

    <label>Location</label>

<input
    type="text"
    id="location"
    name="location"
    placeholder="Enter address manually or select from map"
    required>

<input type="text"
       id="location"
       name="location"
       readonly
       required>

<br><br>

<div id="map"
     style="height:400px;width:100%;border:1px solid #ccc;">
</div>

    <label>Condition Status</label>
    <select name="condition_status">

        <option>Good</option>
        <option>Needs Repair</option>
        <option>Critical</option>

    </select>

    <label>Last Maintenance Date</label>
    <input type="date"
           name="last_maintenance">

    <button type="submit">
        Add Asset
    </button>

</form>

<br>

<a href="ViewAssetsServlet"
   class="view-btn">
    View All Assets
</a>

<script>

let map;
let marker;

function initMap() {

    const defaultLocation = {
        lat: 33.6844,
        lng: 73.0479
    };

    map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 12,
            center: defaultLocation
        }
    );

    map.addListener("click", function(event) {

        if(marker){
            marker.setMap(null);
        }

        marker = new google.maps.Marker({
            position: event.latLng,
            map: map
        });

        document.getElementById("location").value =
                event.latLng.lat()
                + ", "
                + event.latLng.lng();
    });
}

</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQSRFDk4L0fPIFvNfbFuyLN1-2-GQrTZc&callback=initMap">
</script>
</body>
</html>
