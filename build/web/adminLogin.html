<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80');

    background-size:cover;
    background-position:center;
}

.login-card{
    width:430px;
    padding:40px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    box-shadow:0 8px 32px rgba(0,0,0,.3);

    color:white;
}

.login-card h2{
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#e5e7eb;
    margin-bottom:35px;
    font-size:15px;
}

.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    color:white;
}

.input-group input{
    width:100%;
    padding:15px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:12px;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:15px;

    outline:none;
}

.input-group input::placeholder{
    color:#d1d5db;
}

.input-group input:focus{
    border:1px solid #60a5fa;
    background:rgba(255,255,255,.12);
}

.login-btn{
    width:100%;
    border:none;

    padding:15px;

    border-radius:40px;

    background:linear-gradient(
    90deg,
    #2563eb,
    #7c3aed);

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(37,99,235,.4);
}

.admin-icon{
    width:90px;
    height:90px;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 20px auto;

    font-size:40px;
}

@media(max-width:500px){

.login-card{
    width:90%;
    padding:30px;
}

.login-card h2{
    font-size:35px;
}

}

</style>

</head>

<body>

<div class="login-card">

    <div class="admin-icon">
        👨‍💼
    </div>

    <h2>Admin Login</h2>

    <div class="subtitle">
        Smart City Administration Panel
    </div>

    <form action="AdminLoginServlet" method="post">

        <div class="input-group">
            <label>Username</label>
            <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>
        </div>

        <button
        type="submit"
        class="login-btn">
        Login
        </button>

    </form>

</div>

</body>
</html>
