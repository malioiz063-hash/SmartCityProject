<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Citizen Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.35)
    ),
    url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1920&q=80');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.register-card{
    width:550px;
    padding:35px;

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.35);

    border-radius:25px;

    box-shadow:0 10px 40px rgba(0,0,0,.30);

    color:white;
}

.register-card h1{
    text-align:center;
    font-size:48px;
    margin-bottom:10px;
}

.register-card p{
    text-align:center;
    color:#f1f1f1;
    margin-bottom:25px;
    font-size:17px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-size:15px;
    font-weight:500;
}

input{
    width:100%;
    padding:14px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:12px;

    background:rgba(255,255,255,.12);

    color:white;

    font-size:15px;

    outline:none;
}

input::placeholder{
    color:#e5e7eb;
}

input:focus{
    border-color:#60a5fa;
}

.error{
    color:#ffd2d2;
    font-size:13px;
    margin-top:5px;
}

.server-error{
    display:none;
    background:#ffe5e5;
    color:#d60000;
    border:1px solid #ffb3b3;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
}

.register-btn{
    width:100%;
    padding:15px;

    border:none;

    border-radius:40px;

    background:linear-gradient(
        90deg,
        #2563eb,
        #7c3aed
    );

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    margin-top:15px;

    transition:.3s;
}

.register-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(37,99,235,.4);
}

.bottom-link{
    text-align:center;
    margin-top:22px;
    color:white;
}

.bottom-link a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:bold;
}

.bottom-link a:hover{
    text-decoration:underline;
}

@media(max-width:600px){

    .register-card{
        width:95%;
        padding:25px;
    }

    .register-card h1{
        font-size:36px;
    }
}

</style>

<script>

function validateForm(){

    let valid=true;

    document.getElementById("nameError").innerHTML="";
    document.getElementById("emailError").innerHTML="";
    document.getElementById("phoneError").innerHTML="";
    document.getElementById("addressError").innerHTML="";
    document.getElementById("passwordError").innerHTML="";

    let name=document.getElementById("full_name").value.trim();
    let email=document.getElementById("email").value.trim();
    let phone=document.getElementById("phone").value.trim();
    let address=document.getElementById("address").value.trim();
    let password=document.getElementById("password").value.trim();

    if(name===""){
        document.getElementById("nameError").innerHTML="Name is required";
        valid=false;
    }

    let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,}$/i;

    if(!email.match(emailPattern)){
        document.getElementById("emailError").innerHTML="Enter valid email";
        valid=false;
    }

    if(!/^\d{11}$/.test(phone)){
        document.getElementById("phoneError").innerHTML="Phone must be 11 digits";
        valid=false;
    }

    if(address===""){
        document.getElementById("addressError").innerHTML="Address is required";
        valid=false;
    }

    if(password.length<8){
        document.getElementById("passwordError").innerHTML="Password must be at least 8 characters";
        valid=false;
    }

    return valid;
}

window.onload=function(){

    const params=new URLSearchParams(window.location.search);

    if(params.get("nameError")){
        document.getElementById("nameError").innerHTML=params.get("nameError");
    }

    if(params.get("emailError")){
        document.getElementById("emailError").innerHTML=params.get("emailError");
    }

    if(params.get("phoneError")){
        document.getElementById("phoneError").innerHTML=params.get("phoneError");
    }

    if(params.get("addressError")){
        document.getElementById("addressError").innerHTML=params.get("addressError");
    }

    if(params.get("passwordError")){
        document.getElementById("passwordError").innerHTML=params.get("passwordError");
    }
};

</script>

</head>

<body>

<div class="register-card">

    <h1>Create Account</h1>

    <p>Register to access Smart City Services</p>

    <div id="serverError" class="server-error"></div>

    <form action="RegisterServlet"
          method="post"
          onsubmit="return validateForm()">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text"
                   id="full_name"
                   name="full_name"
                   placeholder="Enter your full name">
            <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text"
                   id="email"
                   name="email"
                   placeholder="Enter your email">
            <div class="error" id="emailError"></div>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text"
                   id="phone"
                   name="phone"
                   placeholder="03XXXXXXXXX">
            <div class="error" id="phoneError"></div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text"
                   id="address"
                   name="address"
                   placeholder="Enter your address">
            <div class="error" id="addressError"></div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create password">
            <div class="error" id="passwordError"></div>
        </div>

        <button type="submit" class="register-btn">
            Sign Up
        </button>

    </form>

    <div class="bottom-link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

</div>

</body>
</html>
