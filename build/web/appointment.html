<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book Appointment</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fc;
    min-height:100vh;
    padding:40px 20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:35px;
}

.header h1{
    font-size:38px;
    margin-bottom:10px;
}

.header p{
    font-size:16px;
    opacity:0.95;
}

.form-section{
    padding:40px;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    background:#eef2ff;
    color:#2563eb;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    margin-bottom:25px;
}

.back-btn:hover{
    background:#dbeafe;
}

.icon-box{
    text-align:center;
    margin-bottom:25px;
}

.icon-box span{
    font-size:65px;
}

.info-box{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
    color:#1e3a8a;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:20px;
}

.full-width{
    grid-column:1 / 3;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    transition:0.3s;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:auto;
    }

    .header h1{
        font-size:28px;
    }

    .form-section{
        padding:25px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Book Appointment</h1>

        <p>
            Schedule an appointment with your desired department
        </p>

    </div>

    <div class="form-section">

        <a href="CitizenDashboardServlet" class="back-btn">
            ← Back To Dashboard
        </a>

        

        <div class="info-box">
            Select a department, preferred date, and time to book your appointment.
        </div>

        <form action="AppointmentServlet" method="post">

            <div class="form-grid">

                <div class="form-group full-width">
                    <div class="form-group full-width">

    <label>Email Address</label>

    <input
        type="email"
        name="citizen_email"
        placeholder="Enter your email"
        required>

</div>

    <label>Department</label>

    <select name="department" required>

        <option value="">
            Select Department
        </option>

        <option value="">Select Department</option>
<option value="Health Department">Health Department</option>
<option value="Education Department">Education Department</option>
<option value="Transport Department">Transport Department</option>
<option value="Water Authority">Water Authority</option>
<option value="Electricity Authority">Electricity Authority</option>
<option value="Municipal Services">Municipal Services</option>
<option value="Emergency Services">Emergency Services</option>

    </select>

</div>
                <div class="form-group">

                    <label>Appointment Date</label>

                    <input
                    type="date"
                    name="appointment_date"
                    required>

                </div>

                <div class="form-group">

                    <label>Appointment Time</label>

                    <input
                    type="time"
                    name="appointment_time"
                    required>

                </div>

                <div class="form-group full-width">

                    <button
                    type="submit"
                    class="btn">

                    Book Appointment

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
