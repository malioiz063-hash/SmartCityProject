<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Service Request</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fc;
    min-height:100vh;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:35px;
    text-align:center;
}

.header h1{
    font-size:38px;
    margin-bottom:10px;
}

.header p{
    font-size:16px;
    opacity:.95;
}

.form-section{
    padding:40px;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    background:#eef2ff;
    color:#2563eb;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    margin-bottom:25px;
}

.back-btn:hover{
    background:#dbeafe;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:20px;
}

.full-width{
    grid-column:1 / 3;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

textarea{
    resize:none;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
}

.icon-box{
    text-align:center;
    margin-bottom:30px;
}

.icon-box span{
    font-size:65px;
}

.info-box{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
    color:#1e3a8a;
}

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.full-width{
    grid-column:auto;
}

.header h1{
    font-size:28px;
}

.form-section{
    padding:25px;
}

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Service Request</h1>

        <p>
            Submit your request for Smart City municipal services
        </p>

    </div>

    <div class="form-section">

        <a href="CitizenDashboardServlet" class="back-btn">
            ← Back To Dashboard
        </a>

        <div class="icon-box">
            <span>🛠️</span>
        </div>

        <div class="info-box">
            Please provide accurate details so the concerned department can process your request efficiently.
        </div>

        <form action="ServiceRequestServlet" method="post">

            <div class="form-grid">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                    type="email"
                    name="citizen_email"
                    placeholder="Enter your email"
                    required>

                </div>

                <div class="form-group">

    <select name="service_type" required>
    <option value="">Select Department</option>

    <option value="Health Department">Health Department</option>
    <option value="Education Department">Education Department</option>
    <option value="Transport Department">Transport Department</option>
    <option value="Water Authority">Water Authority</option>
    <option value="Electricity Authority">Electricity Authority</option>
    <option value="Municipal Services">Municipal Services</option>
    <option value="Emergency Services">Emergency Services</option>
</select>
                </div>
                <div class="form-group full-width">

                    <label>Location</label>

                    <input
                    type="text"
                    name="location"
                    placeholder="Enter service location"
                    required>

                </div>

                <div class="form-group full-width">

                    <label>Description</label>

                    <textarea
                    name="description"
                    rows="6"
                    placeholder="Describe your issue in detail..."
                    required></textarea>

                </div>

                <div class="form-group full-width">

                    <button
                    type="submit"
                    class="btn">

                    Submit Service Request

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
