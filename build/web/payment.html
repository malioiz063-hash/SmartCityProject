<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Online Payment</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4364f7,#8f44ad);
}

.container{
    width:500px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

</style>

</head>
<body>

<div class="container">

<h2>Online Payment</h2>

<form action="PaymentServlet" method="post">

<input type="email"
name="citizen_email"
placeholder="Enter Email"
required>

<select name="service_name" required>

<option value="">Select Service</option>

<option>Water Bill</option>
<option>Electricity Bill</option>
<option>Property Tax</option>
<option>Garbage Collection Fee</option>
<option>Appointment Fee</option>

</select>

<input type="number"
name="amount"
placeholder="Enter Amount"
required>

<select name="payment_method" required>

<option value="">Payment Method</option>

<option>JazzCash</option>
<option>EasyPaisa</option>
<option>Debit Card</option>
<option>Credit Card</option>

</select>

<button type="submit">
Pay Now
</button>

</form>

</div>

</body>
</html>
