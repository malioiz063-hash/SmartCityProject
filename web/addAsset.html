<!DOCTYPE html>
<html>
<head>
    <title>Add Public Asset</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            width:500px;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input,
        select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 20px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>
<body>

<div class="container">

<h2>Public Asset Management</h2>

<form action="PublicAssetServlet" method="post">

    <label>Asset Name</label>
    <input type="text"
           name="asset_name"
           required>

    <label>Asset Type</label>
    <select name="asset_type">

        <option>Road</option>
        <option>Street Light</option>
        <option>Park</option>
        <option>Building</option>
        <option>Vehicle</option>
        <option>Water Pipeline</option>
        <option>Utility Equipment</option>

    </select>

    <label>Location</label>
    <input type="text"
           name="location"
           required>

    <label>Condition Status</label>

    <select name="condition_status">

        <option>Good</option>
        <option>Needs Repair</option>
        <option>Critical</option>

    </select>

    <label>Last Maintenance Date</label>

    <input type="date"
           name="last_maintenance">

    <button type="submit">
        Add Asset
    </button>

</form>

<br>

<a href="ViewAssetsServlet">
    View All Assets
</a>

</div>

</body>
</html>
