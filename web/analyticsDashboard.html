<!DOCTYPE html>
<html>
<head>

<title>Analytics Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

.chart{
height:350px;
}

</style>

</head>

<body>

<h1>Analytics Dashboard</h1>

<div class="card">

<h3>Complaint Resolution Rate</h3>

<canvas id="complaintChart"></canvas>

</div>

<div class="card">

<h3>Department Performance</h3>

<canvas id="departmentChart"></canvas>

</div>

<div class="card">

<h3>Emergency Reports</h3>

<canvas id="emergencyChart"></canvas>

</div>

<div class="card">

<h3>Service Requests</h3>

<canvas id="serviceChart"></canvas>

</div>

</body>
</html>
